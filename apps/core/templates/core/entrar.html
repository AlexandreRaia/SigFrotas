{% extends 'base.html' %}
{% block titulo %}Entrar · SigFrotas{% endblock %}
{% block conteudo %}
<div class="mx-auto mt-16 max-w-sm rounded bg-white p-6 shadow">
  <h1 class="mb-4 text-xl font-semibold">Entrar no SigFrotas</h1>
  <form method="post" class="space-y-3">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for campo in form %}
      {% if campo.is_hidden %}{{ campo }}{% else %}
      <label class="block text-sm font-medium">{{ campo.label }}
        <input type="{{ campo.field.widget.input_type }}" name="{{ campo.html_name }}" value="{{ campo.value|default_if_none:'' }}"
               class="mt-1 w-full rounded border px-2 py-1 font-normal" required>
      </label>
      {{ campo.errors }}
      {% endif %}
    {% endfor %}
    <button class="w-full rounded bg-slate-800 py-2 text-white">Entrar</button>
  </form>
</div>
{% endblock %}
