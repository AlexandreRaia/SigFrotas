{% extends 'base.html' %}
{% block titulo %}Auditoria · SigFrotas{% endblock %}
{% block conteudo %}
<h1 class="mb-6 text-2xl font-semibold tracking-tight">Auditoria</h1>
<form method="get" class="filtro cartao mb-6 flex flex-wrap items-end gap-4 p-4"
      hx-get="{% url 'auditoria' %}" hx-target="#resultado" hx-push-url="true" hx-indicator="#resultado" hx-trigger="submit, change delay:300ms">
  {% for campo in filtro %}
    <div>
      <label for="{{ campo.id_for_label }}" class="mb-1 block font-medium">{{ campo.label }}</label>
      {{ campo }}
    </div>
  {% endfor %}
  <button class="btn-primario">Filtrar</button>
</form>
<div id="resultado">{% include 'core/_auditoria_tabela.html' %}</div>
{% endblock %}
