<div class="cartao overflow-hidden">
  <div class="overflow-x-auto">
    <table class="tabela uma-linha">
      <thead>
        <tr>
          {% for rotulo, link, sentido in cabecalhos %}
          <th aria-sort="{{ sentido }}">{% if link %}<a href="{{ link }}" hx-get="{{ link }}" hx-target="#resultado" hx-push-url="true" hx-indicator="#resultado"
               class="ordenavel">{{ rotulo }}<span class="seta" aria-hidden="true"></span></a>{% else %}{{ rotulo }}{% endif %}</th>
          {% endfor %}
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        {% for obj, valores in linhas %}
          {% include 'core/_linha.html' %}
        {% empty %}
          <tr><td colspan="{{ cabecalhos|length|add:1 }}" class="vazio">{{ texto_vazio }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% include 'core/paginacao.html' %}
</div>
