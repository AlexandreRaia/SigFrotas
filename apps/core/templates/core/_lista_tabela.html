<div class="cartao overflow-x-auto">
  <table class="w-full text-left">
    <thead class="border-b border-slate-200 bg-slate-50 text-slate-600">
      <tr>{% for c in cabecalhos %}<th class="px-4 py-3 font-semibold">{{ c }}</th>{% endfor %}<th class="px-4 py-3"></th></tr>
    </thead>
    <tbody class="divide-y divide-slate-100">
      {% for obj, valores in linhas %}
        {% include 'core/_linha.html' %}
      {% empty %}
        <tr><td colspan="{{ cabecalhos|length|add:1 }}" class="px-4 py-10 text-center text-slate-600">Nada cadastrado.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% include 'core/paginacao.html' %}
