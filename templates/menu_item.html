{% load sigfrotas %}<a href="{% url url %}" title="{{ rotulo }}"
   class="item-menu flex items-center gap-3 rounded-lg px-3 py-2.5 {% if request.resolver_match.url_name|pagina_de:chave %}bg-primaria-50 font-medium text-primaria-800{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
  <i class="{{ icone }} shrink-0 text-[20px] {% if not request.resolver_match.url_name|pagina_de:chave %}text-gray-500{% endif %}" aria-hidden="true"></i>
  <span class="rotulo whitespace-nowrap">{{ rotulo }}</span>
</a>
